name: LeetCode Sync

on:
  schedule:
    # Runs every 6 hours. GitHub may delay this slightly under load.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can push commits

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run sync script
        id: sync
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF: ${{ secrets.LEETCODE_CSRF }}
        run: python sync.py

      - name: Commit and push new solutions
        if: steps.sync.outputs.new_count != '0'
        run: |
          git config user.name "LalitNarayan824"
          git config user.email "185046237+LalitNarayan824@users.noreply.github.com"
          git add solutions synced.json
          git commit -m "Sync ${{ steps.sync.outputs.new_count }} new LeetCode solution(s)"
          git push
